[build-system]
requires = ["pdm-backend>=2.4.0"]
build-backend = "pdm.backend"

[project]
name = "codingame-client"
version = "0.0.0-dev.1"
description = "Python package codingame-client"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Sam McKelvie", email = "dev@mckelvie.org" },
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
      "json-data-types>=0.2.0",
      "dataclass-wizard @ git+https://github.com/mckelvie-org/dataclass-wizard.git@fix/catchall-reuse-across-contexts",
      "playwright>=1.61.0",
      "private-files>=3.0.0",
      "aiohttp>=3.14.1",
      "filelock>=3.30.3",
      "typing-extensions>=4.12.0",
      "argparse-wizard>=2.1.2",
      "rich>=15.0.0",
      "pytimeparse2>=1.7.1",
      "pyyaml>=6.0.2",
      "platformdirs>=4.3.0"
]

[project.urls]
Homepage = "https://github.com/mckelvie-org/codingame-client"
Source = "https://github.com/mckelvie-org/codingame-client"
"Bug Tracker" = "https://github.com/mckelvie-org/codingame-client/issues"
Changelog = "https://github.com/mckelvie-org/codingame-client/releases"

[project.scripts]
cg = "codingame_client.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "pdm>=2.27.0",
    "vcrpy>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
addopts = "-ra -m \"not live and not live_unauthenticated\""
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_unauthenticated: hits the real CodinGame API directly (no cassette), no login required; excluded by default, never runs in CI",
    "live: hits the real CodinGame API directly (no cassette), requires a prior browser login with real credentials; excluded by default, never runs in CI",
]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".codingame", ".cg_api", "contribution"]
# Without this, exclude/extend-exclude only apply to directory scans (e.g. `ruff check .`)--an
# explicitly-passed path (as the VS Code Ruff extension passes for whatever file is open) bypasses
# them entirely by default. This is what actually makes the "contribution" exclusion take effect
# in the editor, not just on the CLI.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["codingame_client"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["codingame_client"]
exclude = ["^\\.codingame/", "^\\.cg_api/"]

[[tool.mypy.overrides]]
module = ["vcr.*"]
ignore_missing_imports = true

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["codingame_client"]

[tool.pdm.scripts]
test = "pytest"
test-live-unauthenticated = "pytest -m live_unauthenticated"
test-live = "pytest -m live"
lint = "ruff check ."
typecheck = "mypy codingame_client"
post_install = "./bin/post-install"
